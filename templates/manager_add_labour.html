{% extends "base.html" %}
{% block title %}Add Labour{% endblock %}

{% block content %}
<div class="container-fluid">

  <!-- Header -->
  <div class="row mb-3">
    <div class="col-8">
      <h4 class="mb-0">Add Labour</h4>
      <p class="text-muted small">
        Labour will be added to your site and activated automatically
      </p>
    </div>
    <div class="col-4 text-end">
      <a href="{{ url_for('manager_bp.manager_labours') }}"
         class="btn btn-sm btn-outline-secondary">
        Back to Labours
      </a>
    </div>
  </div>

  <!-- Form -->
  <div class="card">
    <div class="card-body">
      <form method="post" enctype="multipart/form-data">

        <!-- Gate Pass -->
        <div class="mb-3">
          <label class="form-label">Gate Pass ID</label>
          <input type="text"
                 name="gate_pass_id"
                 class="form-control"
                 placeholder="Optional">
        </div>

        <div class="row">

          <!-- Name -->
          <div class="col-md-6 mb-3">
            <label class="form-label">Labour Name *</label>
            <input type="text"
                   name="name"
                   class="form-control"
                   required>
          </div>

          <!-- Phone -->
          <div class="col-md-6 mb-3">
            <label class="form-label">Phone Number *</label>
            <input type="text"
                   name="phone"
                   class="form-control"
                   required
                   pattern="[0-9]{10}"
                   maxlength="10"
                   inputmode="numeric"
                   oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                   placeholder="10 digit mobile number">
          </div>

        </div>

        <div class="row">

          <!-- Bank -->
          <div class="col-md-6 mb-3">
            <label class="form-label">Bank Account</label>
            <input type="text"
                   name="bank_account"
                   class="form-control"
                   inputmode="numeric"
                   pattern="[0-9]{9,18}"
                   minlength="9"
                   maxlength="18"
                   oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                   placeholder="Optional">
          </div>

          <!-- IFSC -->
          <div class="col-md-6 mb-3">
            <label class="form-label">IFSC Code</label>
            <input type="text"
                   name="ifsc_code"
                   class="form-control"
                   placeholder="Optional">
          </div>

        </div>

        <!-- Documents -->
        <div class="row mt-3">
          <div class="col-md-4">
            <label>Labour Photo</label>
            <input type="file" name="photo" class="form-control image-input"
              accept="image/*"
              capture="environment">
          </div>

          <div class="col-md-4">
            <label>Aadhaar Front</label>
            <input type="file" name="aadhaar_front" class="form-control image-input"
              accept="image/*"
              capture="environment">
          </div>

          <div class="col-md-4">
            <label>Aadhaar Back</label>
            <input type="file" name="aadhaar_back" class="form-control image-input"
              accept="image/*"
              capture="environment">
          </div>
        </div>

        <div class="row mt-3">

          <div class="col-md-4">
            <label>Gate Pass Front</label>
            <input type="file" name="gate_pass_front" class="form-control image-input"
              accept="image/*"
              capture="environment">
          </div>

          <div class="col-md-4">
            <label>Gate Pass Back</label>
            <input type="file" name="gate_pass_back" class="form-control image-input"
              accept="image/*"
              capture="environment">
          </div>
        </div>

        <!-- Info -->
        <div class="d-flex align-items-center border border-info bg-info-subtle text-info-emphasis rounded shadow-sm px-3 py-2 small">
          
          <i class="fa fa-lock me-2"></i>
          <strong>Note:</strong>&nbsp;Site, daily wage and active status are managed by admin.

        </div>

        

        <!-- Actions -->
        <div class="mt-4">
          <button type="submit" class="btn btn-success">
            <i class="fa fa-check me-1"></i> Add Labour
          </button>
          <a href="{{ url_for('manager_bp.manager_labours') }}"
             class="btn btn-outline-secondary ms-2">
            Cancel
          </a>
        </div>

        

      </form>
    </div>
  </div>

</div>
<div class="modal fade" id="imageCropModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Adjust Image</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body p-2">
        <div class="cropper-wrapper">
          <img id="cropperImage" src="">
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="cropConfirmBtn">Crop & Save</button>
      </div>
    </div>
  </div>
</div>

<!-- SAME CROP / COMPRESS LOGIC AS ADMIN -->
<!-- CropperJS -->
<link rel="stylesheet" href="https://unpkg.com/cropperjs@1.6.2/dist/cropper.min.css">
<script src="https://unpkg.com/cropperjs@1.6.2/dist/cropper.min.js"></script>

<!-- Your logic (ONLY ONCE) -->
<script src="{{ url_for('static', filename='js/image-cropper.js') }}"></script>
<style>
  .cropper-wrapper {
  width: 100%;
  height: 60vh;
}

.cropper-wrapper img {
  max-width: 100%;
}

</style>

{% endblock %}
