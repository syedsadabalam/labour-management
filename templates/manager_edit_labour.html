{% extends "base.html" %}
{% block title %}Edit Labour{% endblock %}

{% block content %}
<div class="container-fluid">

  <!-- HEADER -->
  <div class="d-flex justify-content-between mb-3">
    <div>
      <h4 class="mb-0">Edit Labour</h4>
      <small class="text-muted">You can update details & documents</small>
    </div>
    <a href="{{ url_for('manager_bp.manager_labours') }}"
       class="btn btn-sm btn-outline-secondary">
      Back
    </a>
  </div>

  <form method="post" enctype="multipart/form-data">
    <div class="card p-4">

      <!-- BASIC INFO -->
      <div class="row g-3">

        <div class="col-md-6">
          <label class="form-label">Labour Name</label>
          <input type="text" name="name" class="form-control"
                 value="{{ labour.name }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="text" name="phone" class="form-control"
                 value="{{ labour.phone }}" maxlength="10">
        </div>

        <div class="col-md-6">
          <label class="form-label">Gate Pass ID</label>
          <input type="text" name="gate_pass_id" class="form-control"
                 value="{{ labour.gate_pass_id }}">
        </div>

        <div class="col-md-6">
          <label class="form-label">Bank Account</label>
          <input type="text" name="bank_account" class="form-control"
                 value="{{ labour.bank_account }}">
        </div>

        <div class="col-md-6">
          <label class="form-label">IFSC Code</label>
          <input type="text" name="ifsc_code" class="form-control"
                 value="{{ labour.ifsc_code }}">
        </div>

        <div class="col-md-6">
          <label class="form-label">Daily Wage</label>
          <input type="text" class="form-control"
                 value="₹{{ labour.daily_wage }}" disabled>
        </div>

      </div>

      <hr class="my-4">

      <!-- DOCUMENTS -->
      <h6 class="mb-3">Photo & Documents</h6>

      <div class="row g-3">

        <div class="col-md-4">
          <label>Labour Photo</label>
          <input type="file"
                 name="photo"
                 class="form-control image-input"
                 accept="image/*"
                 capture="environment">
        </div>

        <div class="col-md-4">
          <label>Aadhaar Front</label>
          <input type="file"
                 name="aadhaar_front"
                 class="form-control image-input"
                 accept="image/*"
                 capture="environment">
        </div>

        <div class="col-md-4">
          <label>Aadhaar Back</label>
          <input type="file"
                 name="aadhaar_back"
                 class="form-control image-input"
                 accept="image/*"
                 capture="environment">
        </div>

        <div class="col-md-4">
          <label>Gate Pass Front</label>
          <input type="file"
                 name="gate_pass_front"
                 class="form-control image-input"
                 accept="image/*"
                 capture="environment">
        </div>

        <div class="col-md-4">
          <label>Gate Pass Back</label>
          <input type="file"
                 name="gate_pass_back"
                 class="form-control image-input"
                 accept="image/*"
                 capture="environment">
        </div>

      </div>

      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          Update Labour
        </button>
        <a href="{{ url_for('manager_bp.manager_labours') }}"
           class="btn btn-outline-secondary">
          Cancel
        </a>
      </div>

    </div>
  </form>

</div>
<div class="modal fade" id="imageCropModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Adjust Image</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body p-2">
        <div class="cropper-wrapper">
          <img id="cropperImage" src="">
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="cropConfirmBtn">Crop & Save</button>
      </div>
    </div>
  </div>
</div>

<!-- SAME CROP / COMPRESS LOGIC AS ADMIN -->
<!-- CropperJS -->
<link rel="stylesheet" href="https://unpkg.com/cropperjs@1.6.2/dist/cropper.min.css">
<script src="https://unpkg.com/cropperjs@1.6.2/dist/cropper.min.js"></script>

<!-- Your logic (ONLY ONCE) -->
<script src="{{ url_for('static', filename='js/image-cropper.js') }}"></script>
<style>
  .cropper-wrapper {
  width: 100%;
  height: 60vh;
}

.cropper-wrapper img {
  max-width: 100%;
}

</style>

{% endblock %}
